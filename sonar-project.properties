sonar.projectKey=certy-frontend
sonar.projectName=certy-frontend
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Rutas del código fuente
sonar.sources=src

# Rutas de pruebas
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx

# Exclusiones
sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  build/**,\
  .vite/**,\
  src/vite-env.d.ts,\
  **/*.stories.tsx

# Cobertura - Reporte LCOV de Vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# TypeScript Configuration
sonar.typescript.tsconfigPaths=tsconfig.sonar.json

# JavaScript/TypeScript específicos
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Código duplicado
sonar.cpd.exclusions=src/**/*.test.ts,src/**/*.test.tsx