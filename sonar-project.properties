sonar.projectKey=certy-frontend
sonar.projectName=certy-frontend
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Rutas del código fuente
sonar.sources=src

# Rutas de pruebas
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx

# Exclusiones
sonar.exclusions=\
  node_modules/**,\
  dist/**,\
  build/**,\
  .vite/**,\
  src/vite-env.d.ts,\
  **/*.stories.tsx

# Cobertura - Reporte LCOV de Vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=\
  src/test/**,\
  src/**/*.test.ts,\
  src/**/*.test.tsx,\
  src/main.tsx,\
  src/pages/**,\
  src/components/layout/**,\
  src/App.tsx,\
  src/types/**,\
  src/components/ui/Alert.tsx,\
  src/components/ui/Badge.tsx,\
  src/components/ui/Card.tsx,\
  src/components/ui/FileUpload.tsx,\
  src/components/ui/Modal.tsx,\
  src/components/ui/Pagination.tsx,\
  src/components/ui/SearchInput.tsx,\
  src/components/ui/Select.tsx,\
  src/components/ui/SignaturePad.tsx,\
  src/components/ui/Spinner.tsx,\
  src/components/ui/Textarea.tsx,\
  src/components/ui/index.ts,\
  src/hooks/useCertificates.ts,\
  src/hooks/useInstructors.ts,\
  src/hooks/useTemplates.ts,\
  src/hooks/useTheme.ts,\
  src/services/api.ts,\
  src/services/certificateService.ts,\
  src/services/instructorService.ts

# TypeScript Configuration
sonar.typescript.tsconfigPaths=tsconfig.sonar.json

# JavaScript/TypeScript específicos
sonar.javascript.file.suffixes=.js,.jsx
sonar.typescript.file.suffixes=.ts,.tsx

# Código duplicado
sonar.cpd.exclusions=src/**/*.test.ts,src/**/*.test.tsx