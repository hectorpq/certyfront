sonar.projectKey=certy-frontend
sonar.projectName=certy-frontend
sonar.projectVersion=1.0

# Rutas del código fuente
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx

# Exclusiones críticas para evitar archivos pesados y ruido en el análisis
sonar.exclusions=node_modules/**,dist/**,build/**,.vite/**,src/vite-env.d.ts,**/*.test.ts,**/*.test.tsx

# Configuración del reporte de cobertura (si usas Vitest/Jest con formato lcov)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Codificación de los archivos
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPaths=
sonar.typescript.tsconfigPath=